schema_version: "1.1"
name: teleprompter-outer-display-hinge
expected_outcome: |
  Reads or asks for CaptureView.swift and RecorderModel before writing code. For (a): uses SwiftUI CameraCaptureAccessory (iOS 27.1+) inside .sceneAccessory with init(isEnabled:content:) and onAvailabilityChange, reproducing Apple's teleprompter example; states that no scene-manifest entry is needed because the system assigns the role (UISceneSession.Role.windowCameraCaptureAccessory) and a manifest entry "has no effect"; says content requires full screen on the inner display plus an active camera session and disappears when capture stops, so a pre-recording countdown on the outer display is not supported ("Non-camera apps can't draw directly on the outer display"); flags Xcode 27.1 known issue 190155353 and "Simulator has no camera, so test on a device before shipping". For (b): names onHingeChange / DeviceHinge (angle: Angle, status) and UIHingeInteraction / UIHinge (angle in radians), says hinge data is for effects and layout must come from size classes, reservedRegions(kind: .division) or ArrangementView; uses the parallax for the hinge and refuses to invent a 110-degree or tent/laptop threshold because Apple publishes none and says update rate and precision are system policy; marks .closed/.fullyOpen as unverified and only .partiallyOpen as confirmed; composed code carries the not-compile-checked header, Apple samples are verbatim.
