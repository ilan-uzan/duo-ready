schema_version: "1.1"
name: checkout-form-resets-on-unfold
expected_outcome: |
  Asks to see or reads the three named files (or runs duo_audit.py) before advising. States Apple's rule that a fold is a size-class and trait change, not a scene disconnect, citing DTS thread 847644, and identifies rebuildLayout() in traitCollectionDidChange as the self-inflicted cause; tells the user to keep view instances and relayout rather than tear down, and that stateRestorationActivity(for:) is for true scene disconnect/reconnect, not folds. Explains UIRequiresFullScreen per TN3192 (iOS 27: discrete resize, not an opt-out; UIRequiresFullScreenIgnoredStartingWithVersion; migration checklist: launch screen, all orientations, remove the key) and Tech Talk 111461 ("still resizes when the device opens or closes"). Quotes both orientation answers from thread 847644 without resolving them. Says to pause media on background, labelling the inactive-in-Split-View observation as third-party/simulator. Does not claim Apple says the fold never changes scenePhase; names the multi-window DTS answer (847838) as the only documented phase change and flags the rest as a gap.
