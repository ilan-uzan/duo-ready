schema_version: "1.1"
name: uikit-custom-toolbar-not-vertical
expected_outcome: |
  Cites Apple: "Content from custom UIToolbar, UINavigationBar, or UITabBar instances isn't considered" (Tech Talk 111462) and the Technology Overview's instruction to set items on a view controller inside a navigation controller; tells the user to stop hiding the navigation bar and move the items to navigationItem (audit rules DUO-017/DUO-018 if the audit is run).
  Gives the order and the APIs: Close at the top via navigationItem.leadingItemGroups with leftItemsSupplementBackButton = false, flagging (not resolving) the slide-vs-narration spelling discrepancy; Done via navigationItem.pinnedTrailingGroup; the segmented control stays horizontal (axisBehavior = .horizontalOnly, segmented controls "stay in the nav bar"); the custom ellipsis menu's actions move into navigationItem.additionalOverflowItems with the ellipsis reserved for the system menu; flexible spacers are zero on the vertical axis; Close and Done need image plus title.
  For Focus mode: override preferredVerticalBarBehavior to return .disabled on that subclass, noting Apple's Calculator-style single-page case, that it should be a stable choice, and that other UIVerticalBarBehavior cases are not enumerated in Apple's published material. For the pill: traitCollection.verticalBarEdge, quoting that it reflects the preferred edge regardless of visibility, and stating that the Swift case names are a gap to confirm in the header; recommends #available(iOS 27.1, *) guards given the iOS 17 target. Composed code carries the not-compile-checked header.
