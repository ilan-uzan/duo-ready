schema_version: "1.1"
name: asc-new-screenshot-slots
expected_outcome: |
  Gives the exact ASC sizes (outer 1398x2034 / 2034x1398, inner 2007x2853 / 2853x2007; up to 10; jpeg/png; no alpha) with the ASC screenshot-specifications URL, and says Duo is not a required size today.
  Explains the April 2027 mandate and quotes both Apple sentences (news post "any apps or games submitted" vs specs page "any app using the iOS 27.1 SDK or later"), says the scope conflict is unresolved and the Upcoming Requirements page does not list it, and recommends both portrait sets before April 2027 as an inferred safe plan.
  Refuses to invent a fastlane device name or ScreenshotDisplayType value for Duo, saying it is undocumented and suggesting manual upload or reading the live API enum.
  Explains the SDK tiers from Apple's Three steps page (Xcode 26.4 archive = letterboxed, centered), that the tier depends on the build SDK not the deployment target, that Xcode 27.1 (27A9275) requires macOS Tahoe 26.6 so the macOS 26.5 runner cannot run it, that the badge comes from uploading Duo screenshots, and warns against uploading mockups because of Guideline 2.3.3 (paraphrased).
