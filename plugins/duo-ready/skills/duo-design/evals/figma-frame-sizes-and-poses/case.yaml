schema_version: "1.1"
name: figma-frame-sizes-and-poses
expected_outcome: |
  The answer says Apple has published no point dimensions, margins, or fold width; quotes only Apple's pixel figures (inner 1878x2670 at 430 ppi, outer 1398x2034 at 460 ppi; ASC screenshots 1398x2034 and 2007x2853) and labels 669x951 / 466x678 pt as third-party simulator measurements while noting 626x890 is an older third-party figure; recommends designing with size classes, layout margins, and safe area insets, framing screenshots to ASC pixel sizes, and points to Apple Design Resources without claiming their contents. It lists Apple's pose words (Technology Overview six-pose caption, HIG book/surface/edges, Tech Talk 111463 Book pose and Table pose), says Apple does not use "flex mode", and recommends two size-class layouts plus a folded note rather than a frame per pose. For the player it cites Tech Talk 111463 table pose (viewing content top, interactive controls bottom) and the overlay arrangement placement, with the same controls kept in every pose. For the Live Activity it cites the HIG Live Activities 28pt limited-width guidance (leading view only, trailing view hidden) and says that page does not name Duo.
