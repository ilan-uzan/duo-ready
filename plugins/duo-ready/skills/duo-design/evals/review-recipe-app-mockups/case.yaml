schema_version: "1.1"
name: review-recipe-app-mockups
expected_outcome: |
  The answer scores the frames against the rubric and leads with blockers, each with an Apple quote: the custom tab bar and text-only Save/Filter buttons will not move to the vertical bar (HIG "Follow the system's vertical layout", "Keep text-based buttons to a minimum", Tech Talk 111462 custom bars "isn't considered"); the 3-column grid should be an even count (HIG "prefer an even number of columns"); Cook Mode may exist as a seated layout but must keep Save and Share and cannot trigger at 110 degrees because there is no pose API and no angle thresholds (Tech Talk 111466 "must keep the same controls and hierarchy", Developer Forums 847644 "no single pose API"); the center-cropped hero needs fill/fit or a focal point (Three steps). It states that Apple has published no point dimensions or margins, gives only the Apple pixel figures and labels the 466x678 / 669x951 pt numbers as third-party, and recommends two size-class layouts plus a note for the folded state rather than six pose frames.
