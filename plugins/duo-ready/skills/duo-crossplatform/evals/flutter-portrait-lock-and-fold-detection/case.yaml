schema_version: "1.1"
name: flutter-portrait-lock-and-fold-detection
expected_outcome: |
  Says no: the inner display ignores supported interface orientations and there is no sanctioned way to lock it (Apple Forums 847644, Tech Talk 111461), so setPreferredOrientations cannot help there; the layout must come from the available size, read MediaQuery in build rather than caching it in initState, pad left and right separately (Apple: handle each side independently), and pause on paused rather than inactive (third-party, Split View can leave a visible app inactive).
  Explains that MediaQuery.displayFeatures is documented for Android and is reported empty on Duo (third-party, unverified), that Apple models the fold as a reserved region of kind division that is active only when partially open and is not part of safe-area insets, and that reaching it from Flutter needs a platform channel to UIView.reservedRegions(kind:options:); offers the HIG even-column-count rule as a fold-data-free alternative.
  Reports Flutter issue #193056 closed as duplicate of #48838 (no multi-window), the open P2 #193078 App Switcher distortion, and names berkaycatak/foldable only as an uncaptured third-party option; states that no framework had official Duo guidance as of 2026-10-26 and that the user should re-check Flutter's release notes and issues. Does not invent a pose API, hinge thresholds, or point dimensions.
